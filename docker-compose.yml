services:
  postgres:
    image: postgres:16
    container_name: expense-reports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
      POSTGRES_DB: expense_reports
    ports:
      - "5432:5432"
    volumes:
      - expense_reports_pgdata:/var/lib/postgresql/data

volumes:
  expense_reports_pgdata:
